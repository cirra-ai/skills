# OpenAI / ChatGPT / Codex packaging profile.
# Applied by scripts/package-openai.sh when building dist/openai/.

budgets:
  max_skill_md_lines: 550
  max_files_per_skill: 80
  # After excluding fixtures/schemas/templates, runtime scripts + references
  # for heavy skills (flow/apex) still land ~500–700KB. Reject the old ~2MB
  # shape; keep headroom under 800KB per skill.
  max_bytes_per_skill: 800000
  max_plugin_bytes: 8000000

# Always excluded from installable OpenAI skill packages.
exclude_always:
  - README.md
  - tests
  - fixtures
  - __pycache__
  - .pytest_cache
  - .ruff_cache
  - "*.pyc"
  - .DS_Store
  - icon-large.png
  - icon-small.png

# Extra excludes for skills that previously failed ChatGPT ingest.
exclude_by_skill:
  sf-flow:
